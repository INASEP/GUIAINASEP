<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>Firma tus Declaraciones Juradas · INASEP</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/signature_pad/4.1.5/signature_pad.umd.min.js"></script>
<style>
  :root {
    --verde: #1A4226; --verde-md: #245C35; --verde-lt: #EBF2EC;
    --dorado: #C9A84C; --dorado-dk: #A88430; --dorado-lt: #FAF3E0;
    --blanco: #FFFFFF; --fondo: #F5F6F3; --txt: #2C3528; --txt-sm: #5A6354;
    --brd: #D0D9D2; --rojo: #B03030;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Inter',sans-serif;background:var(--fondo);color:var(--txt);line-height:1.6;font-size:17px;padding-bottom:3rem;}
  header{background:var(--verde);color:var(--blanco);padding:1.6rem 1.2rem 1.4rem;text-align:center;position:relative;}
  header::after{content:'';position:absolute;bottom:0;left:0;right:0;height:4px;background:linear-gradient(90deg,transparent,var(--dorado),transparent);}
  header h1{font-family:'Playfair Display',serif;font-size:1.4rem;}
  header p{font-size:.85rem;opacity:.75;margin-top:.3rem;}
  .container{max-width:680px;margin:0 auto;padding:1.6rem 1.1rem;}

  .doc-grid{display:grid;grid-template-columns:1fr;gap:.8rem;margin-bottom:1.5rem;}
  .doc-card{background:var(--blanco);border:2px solid var(--brd);border-radius:12px;padding:1rem 1.1rem;text-align:left;cursor:pointer;display:flex;align-items:center;gap:.9rem;transition:.15s;width:100%;}
  .doc-card:hover{border-color:var(--dorado);}
  .doc-card.activo{border-color:var(--verde);background:var(--verde-lt);}
  .doc-card .ic{font-size:1.5rem;flex-shrink:0;}
  .doc-card .nom{font-weight:700;color:var(--verde);font-size:.95rem;line-height:1.3;}
  .doc-card .sub{font-size:.78rem;color:var(--txt-sm);margin-top:.1rem;}

  .panel{background:var(--blanco);border:1px solid var(--brd);border-radius:14px;padding:1.4rem;margin-bottom:1.2rem;box-shadow:0 2px 10px rgba(26,66,38,.05);}

  .hoja{border:1px solid var(--brd);border-radius:10px;padding:1.3rem 1.2rem;background:#fff;}
  .hoja .logo{height:46px;margin-bottom:.7rem;}
  .hoja .tit{font-family:'Playfair Display',serif;font-weight:700;font-size:1.05rem;color:var(--verde);text-align:center;}
  .hoja .sub{font-weight:700;font-size:.86rem;text-align:center;margin-top:.15rem;}
  .hoja .nota{font-size:.72rem;text-align:center;color:var(--txt-sm);margin:.4rem 0 .9rem;}
  .hoja .cuerpo{font-size:.86rem;margin-top:.9rem;}
  .hoja .cuerpo p{margin-bottom:.6rem;}
  .hoja .cuerpo .n{font-weight:700;margin-top:.5rem;}
  .hoja .cuerpo .l{margin-left:1.1rem;}
  .tok{background:var(--dorado-lt);border-bottom:1.5px solid var(--dorado-dk);padding:0 2px;font-weight:600;color:var(--verde);border-radius:2px;}
  .tok.vacio{color:#b58a2e;font-style:italic;}

  fieldset{border:none;margin-top:1.1rem;}
  legend{font-family:'Playfair Display',serif;color:var(--verde);font-size:1.02rem;margin-bottom:.6rem;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:.7rem;}
  label{display:block;font-size:.8rem;font-weight:600;color:var(--txt-sm);margin-bottom:.25rem;margin-top:.7rem;}
  label:first-of-type{margin-top:0;}
  input[type=text]{width:100%;padding:.75rem .85rem;border:1px solid var(--brd);border-radius:8px;font-size:.98rem;font-family:inherit;background:var(--fondo);}
  input[type=text]:focus{outline:2px solid var(--dorado);border-color:var(--dorado);}

  .opciones{margin-top:.7rem;}
  .opcion{display:flex;gap:.6rem;align-items:flex-start;padding:.7rem;border:1px solid var(--brd);border-radius:8px;margin-bottom:.5rem;cursor:pointer;background:var(--fondo);}
  .opcion.sel{border-color:var(--verde);background:var(--verde-lt);}
  .opcion input{margin-top:.2rem;accent-color:var(--verde);width:18px;height:18px;flex-shrink:0;}
  .opcion span{font-size:.85rem;line-height:1.5;}

  .check-row{display:flex;align-items:flex-start;gap:.7rem;margin-top:1.1rem;padding:.9rem;background:var(--dorado-lt);border:1px solid #e6d497;border-radius:10px;}
  .check-row input{width:22px;height:22px;flex-shrink:0;margin-top:.1rem;accent-color:var(--verde);}
  .check-row span{font-size:.86rem;line-height:1.5;}

  .firma-wrap{margin-top:1rem;}
  .firma-lienzo{width:100%;height:200px;border:2px dashed var(--brd);border-radius:10px;background:var(--blanco);touch-action:none;display:block;cursor:crosshair;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;}
  .firma-lienzo.tiene-firma{border-style:solid;border-color:var(--verde);}
  .firma-botones{display:flex;justify-content:space-between;align-items:center;margin-top:.5rem;}
  .firma-botones span{font-size:.75rem;color:var(--txt-sm);}
  .btn-limpiar{background:none;border:1px solid var(--brd);color:var(--txt-sm);font-size:.8rem;padding:.35rem .8rem;border-radius:6px;cursor:pointer;}
  .btn-limpiar:hover{border-color:var(--rojo);color:var(--rojo);}

  .btn-firmar{width:100%;background:var(--verde);color:var(--blanco);border:none;padding:1rem;border-radius:10px;font-size:1.02rem;font-weight:700;margin-top:1.4rem;cursor:pointer;transition:.15s;}
  .btn-firmar:hover:not(:disabled){background:var(--verde-md);}
  .btn-firmar:disabled{background:#a9b3a9;cursor:not-allowed;}

  .exito{display:none;background:var(--verde-lt);border:1px solid #b5ceba;border-radius:12px;padding:1.3rem;text-align:center;margin-top:1rem;}
  .exito.on{display:block;}
  .exito .ic{font-size:2rem;}
  .exito h3{color:var(--verde);font-family:'Playfair Display',serif;margin:.4rem 0;}
  .exito p{font-size:.85rem;color:var(--txt-sm);margin-bottom:.9rem;}
  .exito .hash{font-family:monospace;font-size:.68rem;word-break:break-all;background:var(--blanco);border:1px solid var(--brd);border-radius:6px;padding:.5rem;color:var(--txt-sm);}
  .btn-desc{display:inline-block;background:var(--dorado);color:var(--verde);text-decoration:none;font-weight:700;padding:.7rem 1.4rem;border-radius:8px;margin-top:.9rem;font-size:.9rem;}
  .btn-volver{background:none;border:none;color:var(--txt-sm);font-size:.82rem;cursor:pointer;margin-top:1rem;text-decoration:underline;}
</style>
</head>

/* Auto-selección si se llega con ?doc=art46-6 desde la guía */
(function(){
  const params = new URLSearchParams(location.search);
  const idParam = params.get('doc');
  if (idParam){
    const doc = DOCUMENTOS.find(d => d.id === idParam);
    const card = grid.querySelector(`[data-id="${idParam}"]`);
    if (doc && card) seleccionarDoc(doc, card);
  }
})();

function hoy(){
  const d = new Date();
  return { dia: String(d.getDate()), mes: MESES[d.getMonth()], anio: String(d.getFullYear()),
           fechaCorta: d.toLocaleDateString('es-CL') };
}

function seleccionarDoc(doc, card){
  document.querySelectorAll('.doc-card').forEach(c => c.classList.remove('activo'));
  card.classList.add('activo');
  docActivo = doc;
  const h = hoy();
  valores = { ciudad:'', dia:h.dia, mes:h.mes, anio:h.anio, nombre:'', rut:'', domicilio:'', comuna:'', region:'' };
  opcionSel = null;
  renderPanel();
  document.getElementById('panelFirma').scrollIntoView({behavior:'smooth', block:'start'});
}

function textoConToken(campo, plano){
  const v = valores[campo];
  if (plano) return v || '__________';
  if (!v) return `<span class="tok vacio">completa: ${campo}</span>`;
  return `<span class="tok">${escapeHtml(v)}</span>`;
}
function escapeHtml(s){ return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function armarIntro(doc, plano){
  return doc.intro.replace(/\{\{(\w+)\}\}/g, (_, campo) => textoConToken(campo, plano));
}

function renderPanel(){
  const doc = docActivo;
  const p = document.getElementById('panelFirma');
  p.style.display = 'block';

  let cuerpoHtml = '';
  doc.cuerpo.forEach(b => {
    if (b.n) cuerpoHtml += `<p class="n">${b.n} ${escapeHtml(b.t)}</p>`;
    else if (b.l) cuerpoHtml += `<p class="l"><strong>${b.l}</strong> ${escapeHtml(b.t)}</p>`;
    else if (b.p) cuerpoHtml += `<p>${escapeHtml(b.p)}</p>`;
    else if (b.check) cuerpoHtml += `<div id="opcionesTexto"></div>`;
  });

  let camposHtml = '';
  const etiquetas = { ciudad:'Ciudad donde firma', domicilio:'Domicilio (calle y número)', comuna:'Comuna', region:'Región', nombre:'Nombre completo', rut:'RUT' };
  const camposForm = doc.campos.filter(c => !['dia','mes','anio'].includes(c));
  camposForm.forEach(c => {
    camposHtml += `<label for="f_${c}">${etiquetas[c]}</label><input type="text" id="f_${c}" data-campo="${c}" placeholder="${etiquetas[c]}"/>`;
  });

  p.innerHTML = `
    <div class="hoja">
      <img class="logo" src="${doc.logo}" alt="Subsecretaría de Prevención del Delito"/>
      <div class="tit">${doc.titulo}</div>
      ${doc.subtitulo ? `<div class="sub">${doc.subtitulo}</div>` : ''}
      ${doc.nota ? `<div class="nota">${doc.nota}</div>` : ''}
      <div class="cuerpo">
        <p id="introTexto">${armarIntro(doc, false)}</p>
        ${cuerpoHtml}
        <p style="margin-top:1rem">Nombre: ${textoConToken('nombre', false)} &nbsp; RUT: ${textoConToken('rut', false)}</p>
      </div>
    </div>

    <fieldset>
      <legend>Tus datos</legend>
      ${camposHtml}
    </fieldset>

    <div id="opcionesWrap"></div>

    <label class="check-row" for="checkDecl" style="cursor:pointer">
      <input type="checkbox" id="checkDecl"/>
      <span>Declaro que la información entregada es verídica y firmo esta declaración bajo juramento simple, conforme al texto anterior.</span>
    </label>

    <div class="firma-wrap">
      <label>Tu firma (dibuja con el dedo o el mouse)</label>
      <canvas class="firma-lienzo" id="lienzo"></canvas>
      <div class="firma-botones">
        <span id="firmaEstado">Aún no has firmado</span>
        <button type="button" class="btn-limpiar" id="btnLimpiar">Borrar firma</button>
      </div>
    </div>

    <button class="btn-firmar" id="btnFirmar" disabled>Firmar y descargar PDF</button>

    <div class="exito" id="exito">
      <div class="ic">✅</div>
      <h3>Declaración firmada</h3>
      <p>Se generó tu PDF firmado, igual en formato al original. Descárgalo y súbelo en la plataforma SPD.</p>
      <a class="btn-desc" id="btnDescargar" href="#">⬇ Descargar PDF firmado</a><br/>
      <button class="btn-volver" id="btnOtra">Firmar otra declaración</button>
    </div>
  `;

  if (doc.opciones){
    const w = document.getElementById('opcionesWrap');
    w.innerHTML = `<fieldset><legend>Marca la opción que corresponda</legend><div class="opciones" id="opcionesLista"></div></fieldset>`;
    const lista = document.getElementById('opcionesLista');
    doc.opciones.forEach((texto, i) => {
      const row = document.createElement('label');
      row.className = 'opcion';
      row.innerHTML = `<input type="radio" name="opcion" value="${i}"/><span>${escapeHtml(texto)}</span>`;
      row.querySelector('input').addEventListener('change', () => {
        opcionSel = i;
        document.querySelectorAll('.opcion').forEach(o => o.classList.remove('sel'));
        row.classList.add('sel');
        actualizarOpcionesTexto();
        actualizarBoton();
      });
      lista.appendChild(row);
    });
  }

  camposForm.forEach(c => {
    document.getElementById('f_'+c).addEventListener('input', e => {
      let v = e.target.value;
      if (c === 'rut'){
        v = v.replace(/[^0-9kK]/g,'').toUpperCase();
        if (v.length > 1){
          const dv = v.slice(-1);
          let cuerpo = v.slice(0,-1).replace(/\B(?=(\d{3})+(?!\d))/g,'.');
          v = cuerpo + '-' + dv;
        }
        e.target.value = v;
      }
      valores[c] = v;
      document.getElementById('introTexto').innerHTML = armarIntro(doc, false);
      actualizarBoton();
    });
  });

  document.getElementById('checkDecl').addEventListener('change', actualizarBoton);
  document.getElementById('btnFirmar').addEventListener('click', firmarYGenerarPDF);
  document.getElementById('btnLimpiar').addEventListener('click', limpiarFirma);

  configurarLienzo();
  actualizarBoton();
}

function actualizarOpcionesTexto(){
  const div = document.getElementById('opcionesTexto');
  if (!div) return;
  const doc = docActivo;
  div.innerHTML = doc.opciones.map((t,i) =>
    `<p class="l">☐ ${opcionSel===i ? '<strong>[X marcado]</strong> ' : ''}${escapeHtml(t)}</p>`).join('');
}

/* ---- Canvas de firma táctil (SignaturePad 4.x — Pointer Events nativos: dedo, lápiz y mouse) ---- */
let trazoHecho=false, lienzo, signaturePad, resizeHandler=null;
function configurarLienzo(){
  lienzo = document.getElementById('lienzo');
  ajustarLienzo();

  /* SignaturePad 4.x usa Pointer Events por defecto, que ya cubren touch/lápiz/mouse
     de forma nativa. No se agregan listeners de touch manuales: hacerlo duplica el
     manejo del trazo (SignaturePad + código propio) y es lo que rompía la firma
     táctil en celulares y tablets. El CSS ya fija touch-action:none en el canvas
     para evitar que el dedo haga scroll/zoom mientras se firma. */
  signaturePad = new SignaturePad(lienzo, {
    minWidth: 1.1, maxWidth: 2.6, penColor: '#1A4226', backgroundColor: 'rgba(255,255,255,0)'
  });
  trazoHecho = false;
  signaturePad.addEventListener('beginStroke', () => {
    trazoHecho = true;
    lienzo.classList.add('tiene-firma');
    document.getElementById('firmaEstado').textContent = '✔ Firma capturada';
    actualizarBoton();
  });

  /* Al girar el celular/tablet o cambiar el tamaño de ventana, el canvas se
     reajusta sin perder la firma ya dibujada. */
  if (resizeHandler) window.removeEventListener('resize', resizeHandler);
  resizeHandler = () => {
    if (!lienzo || !document.body.contains(lienzo)) return;
    const datos = signaturePad.toData();
    const habiaFirma = trazoHecho;
    ajustarLienzo();
    signaturePad.clear();
    if (habiaFirma && datos && datos.length) signaturePad.fromData(datos);
  };
  window.addEventListener('resize', resizeHandler);
}
function ajustarLienzo(){
  const ratio = Math.max(window.devicePixelRatio || 1, 1);
  const rect = lienzo.parentElement.getBoundingClientRect();
  const ancho = Math.max(rect.width, 1);
  lienzo.width = ancho * ratio;
  lienzo.height = 200 * ratio;
  lienzo.style.width = ancho + 'px';
  lienzo.style.height = '200px';
  lienzo.getContext('2d').scale(ratio, ratio);
}
function limpiarFirma(){
  signaturePad.clear();
  trazoHecho = false;
  lienzo.classList.remove('tiene-firma');
  document.getElementById('firmaEstado').textContent = 'Aún no has firmado';
  actualizarBoton();
}

function actualizarBoton(){
  const doc = docActivo;
  const camposForm = doc.campos.filter(c => !['dia','mes','anio'].includes(c));
  const camposOk = camposForm.every(c => (valores[c]||'').trim().length > 2);
  const opcionOk = doc.opciones ? opcionSel !== null : true;
  const checkOk = document.getElementById('checkDecl').checked;
  document.getElementById('firmaEstado').textContent = trazoHecho ? '✔ Firma capturada' : 'Aún no has firmado';
  document.getElementById('btnFirmar').disabled = !(camposOk && opcionOk && checkOk && trazoHecho);
}

/* ---- Generar PDF fiel al formato original, paginado (nunca escribe fuera de la hoja) ---- */
async function firmarYGenerarPDF(){
  const doc = docActivo;
  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF({ unit:'mm', format:[216, 330] }); // Oficio
  const margen = 20, ancho = 216 - margen*2;
  const margenSup = 15, margenInf = 22, altoHoja = 330;
  let y = margenSup;
  let pagina = 1;

  function pieDePagina(){
    pdf.setFont('helvetica','normal'); pdf.setFontSize(7.5); pdf.setTextColor(140,140,140);
    pdf.text(`Página ${pagina}`, 216 - margen, altoHoja - 10, { align:'right' });
    pdf.setTextColor(0,0,0);
  }

  function nuevaPagina(){
    pieDePagina();
    pdf.addPage();
    pagina++;
    y = margenSup;
  }

  /* Verifica que quede espacio antes de escribir un bloque; si no, salta de página */
  function asegurarEspacio(altoBloque){
    if (y + altoBloque > altoHoja - margenInf) nuevaPagina();
  }

  pdf.addImage(doc.logo, 'PNG', margen, y, 32, 32);
  y += 32 + 7;

  pdf.setFont('helvetica','bold'); pdf.setFontSize(12); pdf.setTextColor(0,0,0);
  pdf.text(doc.titulo, 108, y, { align:'center' }); y += 5.5;
  if (doc.subtitulo){
    pdf.setFontSize(10);
    const subLineas = pdf.splitTextToSize(doc.subtitulo, ancho - 20);
    pdf.text(subLineas, 108, y, { align:'center' }); y += subLineas.length*4.6 + 1.5;
  }
  if (doc.nota){
    pdf.setFont('helvetica','normal'); pdf.setFontSize(8); pdf.setTextColor(80,80,80);
    const notaLineas = pdf.splitTextToSize(doc.nota, ancho - 30);
    pdf.text(notaLineas, 108, y, { align:'center' }); y += notaLineas.length*3.6 + 2.5;
  }
  y += 2.5;

  pdf.setTextColor(0,0,0); pdf.setFont('helvetica','normal'); pdf.setFontSize(9.5);
  function parrafo(texto, opts={}){
    pdf.setFont('helvetica', opts.bold ? 'bold' : 'normal');
    pdf.setFontSize(9.5);
    const indent = opts.indent || 0;
    const gap = opts.gap !== undefined ? opts.gap : 2.2;
    const lineas = pdf.splitTextToSize(texto, ancho - indent);
    const altoBloque = lineas.length*4.3 + gap;

    /* Si el bloque no cabe entero en lo que queda de hoja, se abre una página nueva
       en vez de seguir escribiendo más allá del borde inferior. */
    asegurarEspacio(altoBloque);

    pdf.text(lineas, margen + indent, y);
    y += lineas.length*4.3 + gap;
  }

  parrafo(armarIntro(doc, true), { gap:3.5 });

  doc.cuerpo.forEach(b => {
    if (b.n) parrafo(b.n + ' ' + b.t, { gap:1.4 });
    else if (b.l) parrafo(b.l + ' ' + b.t, { indent:6, gap:1.6 });
    else if (b.p) parrafo(b.p, { gap:2.5 });
    else if (b.check && doc.opciones){
      doc.opciones.forEach((texto,i) => {
        const marca = opcionSel===i ? '☒' : '☐';
        parrafo(marca + ' ' + texto, { indent:6, gap:1.8 });
      });
      y += 0.5;
    }
  });

  y += 4;
  /* Bloque de Nombre / RUT / Firma: se reserva como una unidad para que nunca
     quede partido entre dos páginas ni sobresalga del margen inferior. */
  const altoBloqueFirma = 6 + 8 + 3 + 25 + 4 + 6;
  asegurarEspacio(altoBloqueFirma);

  pdf.setFont('helvetica','bold'); pdf.setFontSize(10.5);
  pdf.text(`Nombre: ${valores.nombre}`, margen, y); y += 6;
  pdf.text(`RUT: ${valores.rut}`, margen, y); y += 8;

  pdf.setFont('helvetica','normal'); pdf.setFontSize(9.5);
  pdf.text('Firma:', margen, y); y += 3;
  const firmaImg = signaturePad.toDataURL('image/png');
  pdf.addImage(firmaImg, 'PNG', margen, y, 60, 22);
  y += 25;
  pdf.setDrawColor(180,180,180); pdf.line(margen, y, margen+60, y); y += 4;
  pdf.setFontSize(8); pdf.text('Firma del Declarante', margen, y);

  pieDePagina();

  const nombreArchivo = `${doc.id}_${(valores.rut||'').replace(/[.\-]/g,'')}.pdf`;
  const pdfBlob = pdf.output('blob');
  const url = URL.createObjectURL(pdfBlob);

  const btnDesc = document.getElementById('btnDescargar');
  btnDesc.href = url; btnDesc.download = nombreArchivo;
  document.getElementById('exito').classList.add('on');
  document.getElementById('exito').scrollIntoView({behavior:'smooth', block:'center'});
  document.getElementById('btnFirmar').style.display = 'none';
  document.getElementById('btnOtra').addEventListener('click', () => location.reload());

  if (firebaseConfig){
    guardarEnFirebase({ tipo: doc.id, nombre: valores.nombre, rut: valores.rut, fecha: h.fechaCorta, hash, archivo: nombreArchivo });
  }
}

async function calcularHash(texto){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(texto));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
}
